<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Café — La Clé à Molette</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Formulaire d'inscription adhérents (Eva)-->
    <section id="adherents-inscription">
    <h2>Ajouter un adhérent</h2>
    <form id="adherents-form-inscription">
  
        <h3>Vos coordonnées</h3>
    
        <label>Nom
            <input type="text" name="nom" required>
          </label>
        
          <label>Prenom
            <input type="text" name="prenom" required>
          </label>
        
        <label>E-mail
          <input type="email" name="email" required>
        </label>
    
        <label>Téléphone
            <input type="tel" name="telephone" required>
          </label>

          <label>Date d'inscription 
            <input type="date" name="date" required>
          </label>
    
        <h3>Vos objets</h3>
    
        <div id="liste-objets">
          <div class="objet">
    
            <label>Objet à réparer
              <input type="text" name="objet" required>
            </label>
    
            <label>Description du problème
              <textarea name="description" required></textarea>
            </label>
    
          </div>
        </div>
    
        <button type="button" id="ajouter-objet">
          + Ajouter un autre objet
        </button>
    
        <button type="submit">Envoyer</button>
    
      </form>
    </section>
    <!-- Liste des adhérents (Eva)-->
    <section id="liste-adherents">
    <h2>Adhérents actifs</h2>
        <ul id="adherents"></ul>
    </section>

    <script src="liste-adherents.js"></script>

</body>
</html>
